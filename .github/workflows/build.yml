name: Build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Session tests
        run: ./gradlew :core:domain:test :core:session:test --stacktrace
      - uses: android-actions/setup-android@v3
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug :engine:audio:testDebugUnitTest --stacktrace
